[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "invenio-classifier"
version = "1.3.14"
description = "Invenio module for record classification."
readme = "README.md"
license = { text = "GPLv2" }
authors = [{ name = "CERN", email = "admin@inspirehep.net" }]
keywords = ["invenio", "keyword", "classification", "pdf"]
requires-python = ">=3.11"
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Development Status :: 5 - Production/Stable",
]
dependencies = ["rdflib>=7.0.0", "requests>=2.32.0"]

[project.urls]
Homepage = "https://github.com/inveniosoftware-contrib/invenio-classifier"

[project.optional-dependencies]
tests = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
all = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.poetry]
packages = [{ include = "invenio_classifier" }]

[tool.pytest.ini_options]
addopts = "--cov=invenio_classifier --cov-report=term-missing"
